---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/default/requirements.yml

driver:
  name: docker

platforms:
  - name: debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  - name: rockylinux8
    image: geerlingguy/docker-rockylinux8-ansible:latest
    command: ""
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      stdout_callback: default
      result_format: yaml
      callbacks_enabled: profile_tasks
  inventory:
    group_vars:
      all:
        # Docker driver attaches as root via `docker exec`, so we don't need
        # sudo. This avoids a known PAM/sudo failure on Rocky 9 containers
        # ("PAM account management error").
        ansible_become: false
        influxdb_admin_user: admin
        influxdb_admin_pw: molecule-admin-pw
        influxdb_db_name: molecule_test
        influxdb_db_user: molecule_user
        influxdb_db_pw: molecule-db-pw
    host_vars:
      # Rocky 8 default /usr/bin/python3 is Python 3.6, which cannot run
      # ansible-core >= 2.15. prepare.yml installs python39 via dnf;
      # everything from converge onward must use that interpreter.
      rockylinux8:
        ansible_python_interpreter: /usr/bin/python3.9

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
