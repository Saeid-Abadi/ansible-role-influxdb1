---
- name: Prepare
  hosts: all
  gather_facts: false

  tasks:
    # Rocky / RHEL 8 ships Python 3.6 at /usr/bin/python3, but
    # ansible-core >= 2.15 requires Python >= 3.7 on managed nodes.
    # We install python39 via a raw dnf call (setup module would fail
    # with Python 3.6) before any other task runs.
    - name: Bootstrap Python 3.9 on Rocky / RHEL 8
      ansible.builtin.raw: |
        set -e
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          case "${ID}-${VERSION_ID%%.*}" in
            rocky-8|rhel-8|centos-8|almalinux-8)
              if ! command -v python3.9 >/dev/null 2>&1; then
                dnf install -y python39 python39-pip
              fi
              ;;
          esac
        fi
      changed_when: false
