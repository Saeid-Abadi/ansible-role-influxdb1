---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  vars:
    influxdb_admin_user: admin
    influxdb_admin_pw: molecule-admin-pw
    influxdb_db_name: molecule_test
    influxdb_db_user: molecule_user

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert influxdb service is registered
      ansible.builtin.assert:
        that:
          - "'influxdb.service' in ansible_facts.services"
        fail_msg: "influxdb.service not registered on the system"

    - name: Assert influxdb service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['influxdb.service'].state == 'running'
        fail_msg: >-
          influxdb service is not running. State:
          {{ ansible_facts.services['influxdb.service'].state | default('not-found') }}

    - name: Assert influxdb service is enabled at boot
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts.services['influxdb.service'].status
            in ['enabled', 'enabled-runtime', 'static', 'alias']
        fail_msg: >-
          influxdb service is not enabled. Status:
          {{ ansible_facts.services['influxdb.service'].status | default('not-found') }}

    - name: Wait for HTTP /ping endpoint to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:8086/ping"
        status_code:
          - 200
          - 204
      register: ping_result
      retries: 15
      delay: 2
      until: ping_result.status in [200, 204]

    - name: Query databases with admin credentials
      ansible.builtin.uri:
        url: "http://127.0.0.1:8086/query?q=SHOW+DATABASES"
        method: GET
        url_username: "{{ influxdb_admin_user }}"
        url_password: "{{ influxdb_admin_pw }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: databases
      retries: 5
      delay: 2
      until: databases.status == 200

    - name: Show databases response (debug)
      ansible.builtin.debug:
        var: databases.content

    - name: Assert configured database exists
      ansible.builtin.assert:
        that:
          - influxdb_db_name in databases.content
        fail_msg: >-
          Expected database '{{ influxdb_db_name }}' was not returned by
          SHOW DATABASES. Got: {{ databases.content }}

    - name: Query users with admin credentials
      ansible.builtin.uri:
        url: "http://127.0.0.1:8086/query?q=SHOW+USERS"
        method: GET
        url_username: "{{ influxdb_admin_user }}"
        url_password: "{{ influxdb_admin_pw }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: users

    - name: Show users response (debug)
      ansible.builtin.debug:
        var: users.content

    - name: Assert configured db user exists
      ansible.builtin.assert:
        that:
          - influxdb_db_user in users.content
        fail_msg: >-
          Expected db user '{{ influxdb_db_user }}' was not returned by
          SHOW USERS. Got: {{ users.content }}
