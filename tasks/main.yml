---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      This role supports only Debian- and RedHat-family systems.
      Detected ansible_os_family: {{ ansible_os_family }}
    success_msg: "Detected supported OS family: {{ ansible_os_family }}"

- name: Load OS-family specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install InfluxDB (Debian family)
  ansible.builtin.include_tasks: install-Debian.yml
  when: ansible_os_family == 'Debian'

- name: Install InfluxDB (RedHat family)
  ansible.builtin.include_tasks: install-RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: Configure InfluxDB
  ansible.builtin.include_tasks: configure.yml

- name: Manage InfluxDB database and users
  ansible.builtin.include_tasks: database.yml
