---
- name: Install prerequisite packages (RedHat)
  ansible.builtin.package:
    name: "{{ influxdb_prereq_packages }}"
    state: present

# Download the GPG key to a local file first. On Rocky 8 importing the
# key directly from an HTTPS URL is less reliable than importing from a
# local file, and the unified stable repo is signed with
# influxdata-archive_compat.key (not the legacy per-distro key).
- name: Download InfluxData GPG key
  ansible.builtin.get_url:
    url: "{{ influxdb_repo_gpgkey }}"
    dest: "{{ influxdb_repo_gpgkey_path }}"
    mode: '0644'
    owner: root
    group: root
  when: influxdb_manage_repo | bool

- name: Import InfluxData GPG key into rpm
  ansible.builtin.rpm_key:
    key: "{{ influxdb_repo_gpgkey_path }}"
    state: present
  when: influxdb_manage_repo | bool

- name: Add InfluxData YUM repository
  ansible.builtin.yum_repository:
    name: "{{ influxdb_repo_name }}"
    description: "{{ influxdb_repo_description }}"
    baseurl: "{{ influxdb_repo_baseurl }}"
    gpgkey: "file://{{ influxdb_repo_gpgkey_path }}"
    gpgcheck: true
    enabled: true
    state: present
  when: influxdb_manage_repo | bool

- name: Install InfluxDB (RedHat)
  ansible.builtin.package:
    name: "{{ influxdb_package_name }}"
    state: present
