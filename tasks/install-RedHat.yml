---
- name: Install prerequisite packages (RedHat)
  ansible.builtin.package:
    name: "{{ influxdb_prereq_packages }}"
    state: present

- name: Download InfluxData GPG keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.path }}"
    mode: '0644'
    owner: root
    group: root
  loop: "{{ influxdb_repo_gpgkeys }}"
  when: influxdb_manage_repo | bool

- name: Import InfluxData GPG keys into rpm
  ansible.builtin.rpm_key:
    key: "{{ item.path }}"
    state: present
  loop: "{{ influxdb_repo_gpgkeys }}"
  when: influxdb_manage_repo | bool

- name: Add InfluxData YUM repository
  ansible.builtin.yum_repository:
    name: "{{ influxdb_repo_name }}"
    description: "{{ influxdb_repo_description }}"
    baseurl: "{{ influxdb_repo_baseurl }}"
    gpgkey: "{{ influxdb_repo_gpgkeys | map(attribute='path') | map('regex_replace', '^', 'file://') | list }}"
    gpgcheck: true
    enabled: true
    state: present
  when: influxdb_manage_repo | bool

- name: Install InfluxDB (RedHat)
  ansible.builtin.package:
    name: "{{ influxdb_package_name }}"
    state: present
