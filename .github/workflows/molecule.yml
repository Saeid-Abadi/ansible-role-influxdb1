---
name: Molecule

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.15' 'ansible-lint>=6.22' yamllint

      - name: Install required collections for lint
        run: |
          ansible-galaxy collection install community.general ansible.posix

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.distro }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - ubuntu2204
          - rockylinux9
          - rockylinux8
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Molecule and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.15' 'molecule>=6' 'molecule-plugins[docker]' \
            docker requests

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install community.general community.docker ansible.posix

      - name: Run Molecule (${{ matrix.distro }})
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
        run: |
          molecule test --platform-name "${MOLECULE_DISTRO}"
